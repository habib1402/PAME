[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pame"
version = "1.0.0"
description = "Protocol-aware mask embedding for multi-dataset tooth instance segmentation (MMDetection plugin)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [{name = "Habib Khan"}]

[tool.setuptools]
packages = ["pame"]
